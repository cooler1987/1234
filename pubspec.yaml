name: fish_audio_reader
description: A Flutter reader with Microsoft and Fish Audio TTS engines.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  file_picker: ^8.0.7
  audioplayers: ^6.0.0
  archive: ^3.6.1
  crypto: ^3.0.3
  http: ^1.2.2
  path_provider: ^2.1.3
  flutter_tts: 4.2.2
  permission_handler: ^11.3.1

flutter:
  uses-material-design: true
